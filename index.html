<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#161521" />
    <title>Signé, Maître! · Port-Fer</title>
    <style>* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #161521;
  color: #fff3ce;
  font:
    600 14px/1.35 system-ui,
    sans-serif;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
button {
  font: inherit;
  color: inherit;
  background: #211e2c;
  border: 1px solid #a99e86;
  cursor: pointer;
  touch-action: none;
}
button:hover,
button:focus-visible,
dialog[data-gamepad] button:focus {
  color: #ffdf62;
  border-color: #ffdf62;
}
#top {
  position: absolute;
  top: max(14px, env(safe-area-inset-top));
  left: 16px;
  right: 16px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}
#brand,
#stats,
#ticker,
#hint,
dialog,
#keys {
  background: #191723f5;
  box-shadow: 3px 3px 0 #060810;
  border: 1px solid #96806b;
}
#brand {
  border-left: 5px solid #f469a1;
  padding: 8px 14px;
}
h1 {
  font:
    bold italic clamp(22px, 3.4vw, 40px)/1 Georgia,
    serif;
  margin: 0;
  color: #ffce59;
  text-shadow: 2px 2px #7e3142;
}
#district {
  font: 700 11px/1.8 monospace;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
#stats {
  font: 700 13px/1.5 monospace;
  padding: 7px 12px;
  text-align: right;
  color: #ffda7c;
}
#rideStats:not(:empty) { margin-inline-start: .7em; }
#tools {
  position: absolute;
  right: 16px;
  top: 86px;
  display: flex;
  gap: 4px;
}
#tools button {
  padding: 5px 8px;
  font: 700 12px monospace;
}
[data-key="horn"][aria-pressed="true"] {
  color: #ffdf62;
  border-color: #ffdf62;
}
#ticker {
  position: absolute;
  left: 16px;
  bottom: 72px;
  max-width: min(460px, 78vw);
  padding: 8px 12px;
  border-left: 4px solid #f469a1;
  pointer-events: none;
}
#ticker:empty {
  display: none;
}
#hint {
  position: absolute;
  left: 16px;
  bottom: 38px;
  padding: 4px 10px;
  color: #ffdf77;
  font: 700 13px monospace;
}
#keys {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 6px 16px;
  color: #d8d0bd;
  font: 12px monospace;
}
#touch {
  display: none;
}
#streetHeader,
#streetMessages {
  display: contents;
}
dialog {
  position: absolute;
  max-width: min(480px, 92vw);
  max-height: 80dvh;
  color: #fff0d5;
  border-top: 5px solid #ed6294;
  padding: 24px;
}
dialog::backdrop {
  background: #1214219e;
}
dialog h2 {
  margin: 0 0 10px;
  font: italic bold 32px Georgia;
  color: #ffcf68;
}
dialog p {
  line-height: 1.45;
}
dialog[data-gamepad] .keyboard-help {
  display: none;
}
dialog button {
  padding: 8px 12px;
  margin: 3px 5px 3px 0;
}
#dialogControls {
  margin-bottom: 0;
  color: #ffdf77;
  font: 12px/1.45 monospace;
}
#mapLegend {
  display: none;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 1px;
}
@media (pointer: coarse), (max-width: 650px) {
  #top {
    left: 8px;
    right: 8px;
    top: 8px;
  }
  #tools {
    top: 71px;
    right: 8px;
  }
  #stats {
    font-size: 11px;
    padding: 5px;
  }
  #brand {
    padding: 5px 9px;
  }
  #district {
    font-size: 9px;
  }
  #keys {
    display: none;
  }
  #vehicleSignal {
    display: none;
  }
  #touch {
    display: flex;
    position: absolute;
    bottom: max(8px, env(safe-area-inset-bottom));
    left: 8px;
    right: 8px;
    align-items: flex-end;
    justify-content: space-between;
    pointer-events: none;
  }
  .pad,
  .acts {
    display: grid;
    gap: 3px;
    pointer-events: auto;
  }
  .pad {
    grid-template-columns: repeat(3, 40px);
  }
  .acts {
    grid-template-columns: repeat(3, clamp(44px, 15vw, 57px));
  }
  #touch button {
    padding: 0;
    height: 44px;
    background: #211e2ce8;
    user-select: none;
    -webkit-user-select: none;
  }
  .up {
    grid-column: 2;
  }
  .left {
    grid-column: 1;
  }
  #hint {
    bottom: 106px;
    left: 8px;
    max-width: 94vw;
  }
  #ticker {
    bottom: 138px;
    left: 8px;
    font-size: 12px;
    max-width: 84vw;
  }
}

#brand {
  background: linear-gradient(100deg, #16101ef0, #221d29bf);
  border-color: #b58059;
  border-left: 3px solid #ef679a;
  padding: 6px 12px;
}
h1 {
  font-size: clamp(20px, 2.5vw, 34px);
}
#tools {
  top: 54px;
}
#tools button {
  background: #231b2ad9;
}
#ticker,
#hint,
#keys,
#stats {
  background: #15121ee3;
}
#hint {
  font-size: 12px;
}
#keys {
  font-size: 11px;
  padding: 5px 12px;
}
#ticker {
  max-width: min(440px, 80vw);
}
#language {
  color: #ffd071;
}
canvas {
  image-rendering: auto;
}
@media (max-width: 650px) {
  #tools {
    top: 54px;
    gap: 2px;
  }
  #tools button {
    font-size: 10px;
    padding: 4px;
  }
  #hint {
    font-size: 11px;
  }
  #brand {
    padding: 4px 8px;
  }
}
:is(#routeCard, #travelCard) {
  position: absolute;
  top: 90px;
  left: 16px;
  width: min(290px, 45vw);
  padding: 9px 12px;
  background: #1a1521f0;
  border: 1px solid #927754;
  border-left: 3px solid #efbb59;
  box-shadow: 3px 3px 0 #100e18b8;
  pointer-events: none;
}
.fileMeta, #fileList small {
  font: 700 10px/1.3 monospace;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #edc58d;
}
.fileMeta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.fileMeta small { font: inherit; }
:is(#routeDistance, #travelDistance) { color: #ffdc79; text-transform: none; letter-spacing: 0; }
#routeTitle, #travelTitle, #fileList strong {
  display: block;
  color: #fff0cf;
  font: bold 20px/1.2 Georgia, serif;
}
#routeBrief, #fileList p, #filesNote {
  font: 13px/1.35 system-ui, sans-serif;
  color: #e2d8c7;
}
#routeBrief { display: block; margin-top: 2px; }
:is(#routeStep, #travelStep) {
  border-top: 1px solid #705a48;
  margin-top: 6px;
  padding-top: 5px;
  color: #ffdb81;
  font: 12px/1.35 system-ui, sans-serif;
}
#routePlace::after { content: " · "; }
#mapSheet {
  position: absolute;
  inset: 95px 4vw 54px;
  max-width: 1150px;
  margin-inline: auto;
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(230px, 1fr);
  align-items: center;
  gap: clamp(16px, 3vw, 40px);
}
#routeCard[hidden], #travelCard[hidden], #mapSheet[hidden] { display: none; }
body:has(#mapSheet:not([hidden])) :is(#hint, #ticker, #touch, #reportBtn) { display: none; }
#mapColumn {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  pointer-events: none;
}
#mapSheet h2 { color: #ffd172; margin: 0; }
#mapTitle { font: bold 15px/1.3 monospace; letter-spacing: .07em; }
#mapWindow { min-height: 0; flex: 0 1 auto; aspect-ratio: 1.7; margin: 12px 10px; }
#mapKey { font: 12px/1.45 monospace; color: #efdcbd; }
#mapKey span { display: block; }
#tripOptions { margin-top: 5px; font: 12px/1.4 monospace; }
#tripPrompt { color: #efdcbd; margin-bottom: 3px; }
#tripOptions button { padding: 5px 6px; pointer-events: auto; }
#tripOptions button[aria-pressed="true"] { border-color: #ffdf62; color: #ffdf62; }
#tripOptions button:disabled { opacity: .45; }
#tripOptions [data-trip="bike"] b { color: #f2bd70; }
#tripOptions [data-trip="mooring"] b { color: #a1e3de; }
#tripOptions [data-trip="station"] b { color: #f3e3bf; }
#casebook {
  max-height: 100%;
  min-height: 0;
  overflow: auto;
  padding: 14px 16px;
  border: 1px solid #977959;
  border-top: 3px solid #e9b552;
  background: #1b1722;
  box-shadow: 3px 3px 0 #0b0a11;
  scrollbar-color: #967b62 #1b1722;
}
#filesTitle { font: bold italic 25px Georgia, serif; }
#fileList { list-style: none; padding: 0; margin: 0; }
#fileList li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px solid #564839;
}
.filePin {
  display: grid;
  place-items: center;
  flex: 0 0 21px;
  height: 21px;
  border-radius: 50%;
  color: #231b29;
  font: bold 14px monospace;
}
#fileList small { display: block; }
#fileList p { margin: 2px 0 0; }
#fileList .fileStep { color: #ffdb81; }
#filesNote { font-size: 12px; margin: 12px 0 0; color: #d4bda1; }
#filesNote:empty { display: none; }
@media (max-width: 650px) {
  :is(#routeCard, #travelCard) {
    top: 82px;
    left: 8px;
    width: min(258px, 84vw);
    padding: 5px 8px;
  }
  #routeTitle, #travelTitle { font-size: 17px; }
  #routeBrief, #routeStep, #travelStep { font-size: 12px; }
  #routeStep, #travelStep { margin-top: 4px; padding-top: 3px; }
}
@media (max-width: 650px) and (orientation: portrait) {
  #mapSheet {
    inset: 90px 12px max(12px, env(safe-area-inset-bottom));
    grid-template-columns: 1fr;
    grid-template-rows: minmax(120px, 1fr) minmax(0, auto);
    gap: 12px;
  }
  #casebook { max-height: 44dvh; }
}
@media (max-height: 500px) {
  #mapSheet { inset: 83px 14px 12px; gap: 14px; }
  #casebook { padding: 8px 10px; }
  #fileList li { margin-top: 5px; padding-top: 5px; }
  :is(#routeCard, #travelCard) { top: 64px; left: 8px; width: min(250px, 35vw); padding: 4px 7px; }
}

@media (max-width: 650px) and (orientation: portrait) {
  body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
  #game { position: absolute; inset: 0; }
  #streetHeader {
    grid-row: 1;
    position: relative;
    display: grid;
    gap: 5px;
    padding: max(8px, env(safe-area-inset-top)) 8px 0;
    pointer-events: none;
  }
  #streetHeader > * { position: static; }
  #rideStats:not(:empty) { display: block; margin-inline-start: 0; }
  #tools { justify-content: flex-end; flex-wrap: wrap; }
  #tools button { pointer-events: auto; }
  #streetMessages {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    bottom: calc(max(8px, env(safe-area-inset-bottom)) + 97px);
    left: 8px;
    right: 76px;
    pointer-events: none;
  }
  #streetMessages > * { position: static; max-width: 100%; }
  #mapSheet {
    grid-row: 2;
    position: relative;
    inset: auto;
    margin: 8px 12px max(12px, env(safe-area-inset-bottom));
  }
}

@media (pointer: coarse) and (min-width: 651px) and (max-height: 500px) {
  #tools {
    left: calc(min(250px, 35vw) + 16px);
    justify-content: flex-end;
    flex-wrap: wrap;
    pointer-events: none;
  }
  #tools button { pointer-events: auto; }
  #streetMessages {
    display: flex;
    position: absolute;
    left: 144px;
    right: 195px;
    bottom: max(8px, env(safe-area-inset-bottom));
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    pointer-events: none;
  }
  #streetMessages > * { position: static; max-width: 100%; }
  #ticker { padding: 4px 8px; }
}
</style>
  </head>
  <body>
    <canvas
      id="game"
      aria-label="Overhead street map of Port-Fer. Move with arrows, WASD or ZQSD. Use F for cars, E for jobs, Space for action."
    ></canvas>
    <div id="streetHeader">
      <div id="top">
        <div id="brand">
          <h1>Signé, Maître !</h1>
          <div id="district"></div>
        </div>
        <div id="stats"><span id="playerStats"></span><span id="rideStats"></span></div>
      </div>
      <div id="tools">
        <button id="reportBtn" hidden>R · Incident report</button><button id="mapBtn">Map</button
        ><button id="help">Keys</button><button id="sound">Sound off</button><button id="quip">Quip</button
        ><button id="language">FR</button><button id="vehicleSignal" data-key="horn" hidden>Horn</button>
      </div>
      <aside id="routeCard" hidden>
        <div class="fileMeta"><small id="routeType"></small><b id="routeDistance"></b></div>
        <strong id="routeTitle"></strong>
        <span id="routeBrief"></span>
        <div id="routeStep"><b id="routePlace"></b><span id="routeAction"></span></div>
      </aside>
      <aside id="travelCard" hidden>
        <div class="fileMeta"><small id="travelType"></small><b id="travelDistance"></b></div>
        <strong id="travelTitle"></strong>
        <div id="travelStep"></div>
      </aside>
    </div>
    <section id="mapSheet" hidden aria-labelledby="mapTitle">
      <div id="mapColumn">
        <h2 id="mapTitle"></h2>
        <div id="mapWindow"></div>
        <div id="mapKey"><span></span><span></span></div>
        <div id="tripOptions" aria-labelledby="tripPrompt" role="group">
          <div id="tripPrompt"></div>
          <button data-trip="bike"></button>
          <button data-trip="mooring"></button>
          <button data-trip="station"></button>
        </div>
      </div>
      <section id="casebook" tabindex="0" aria-labelledby="filesTitle">
        <h2 id="filesTitle"></h2>
        <ol id="fileList"></ol>
        <p id="filesNote"></p>
      </section>
    </section>
    <div id="streetMessages">
      <div id="ticker" role="status"></div>
      <div id="hint"></div>
    </div>
    <div id="keys">
      ↑ ↓ ← → / WASD / ZQSD &nbsp; Move or drive　 F &nbsp; Enter / exit　 SPACE &nbsp; Slap / handbrake　 E
      &nbsp; Job　 M &nbsp; Map
    </div>
    <div id="touch">
      <div class="pad">
        <button class="up" data-key="up" data-konami="ArrowUp" aria-label="Up">▲</button
        ><button class="left" data-key="left" data-konami="ArrowLeft" aria-label="Left">◀</button
        ><button data-key="down" data-konami="ArrowDown" aria-label="Down">▼</button
        ><button data-key="right" data-konami="ArrowRight" aria-label="Right">▶</button>
      </div>
      <div class="acts">
        <button data-key="car">Board</button><button data-key="job">Job</button><button data-key="run">Run</button
        ><button id="touchSignal" data-key="horn" hidden>Horn</button
        ><button data-key="action">Slap / Brake</button><button data-konami="b">B</button><button data-konami="a">A</button>
      </div>
    </div>
    <dialog id="panel" aria-labelledby="heading">
      <h2 id="heading"></h2>
      <p id="copy"></p>
      <p id="controllerHelp" hidden></p>
      <div id="choices"></div>
      <p id="dialogControls" hidden></p>
    </dialog>
    <script src="game/game-H5H55QKM.js"></script>
  </body>
</html>
