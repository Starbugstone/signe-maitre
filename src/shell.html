<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#161521" />
    <title>Signé, Maître! · Port-Fer</title>
    <!--STYLE-->
  </head>
  <body>
    <canvas
      id="game"
      aria-label="Overhead street map of Port-Fer. Move with arrows, WASD or ZQSD. Use F for cars, E for jobs, Space for action."
    ></canvas>
    <div id="streetHeader">
      <div id="top">
        <div id="brand">
          <h1>Signé, Maître !</h1>
          <div id="district"></div>
        </div>
        <div id="stats"><span id="playerStats"></span><span id="rideStats"></span></div>
      </div>
      <div id="tools">
        <button id="reportBtn" hidden>R · Incident report</button><button id="mapBtn">Map</button
        ><button id="help">Keys</button><button id="sound">Sound off</button><button id="quip">Quip</button
        ><button id="language">FR</button><button id="vehicleSignal" data-key="horn" hidden>Horn</button>
      </div>
      <aside id="routeCard" hidden>
        <div class="fileMeta"><small id="routeType"></small><b id="routeDistance"></b></div>
        <strong id="routeTitle"></strong>
        <span id="routeBrief"></span>
        <div id="routeStep"><b id="routePlace"></b><span id="routeAction"></span></div>
      </aside>
      <aside id="travelCard" hidden>
        <div class="fileMeta"><small id="travelType"></small><b id="travelDistance"></b></div>
        <strong id="travelTitle"></strong>
        <div id="travelStep"></div>
      </aside>
    </div>
    <section id="mapSheet" hidden aria-labelledby="mapTitle">
      <div id="mapColumn">
        <h2 id="mapTitle"></h2>
        <div id="mapWindow"></div>
        <div id="mapKey"><span></span><span></span></div>
        <div id="tripOptions" aria-labelledby="tripPrompt" role="group">
          <div id="tripPrompt"></div>
          <button data-trip="bike"></button>
          <button data-trip="mooring"></button>
          <button data-trip="station"></button>
        </div>
      </div>
      <section id="casebook" tabindex="0" aria-labelledby="filesTitle">
        <h2 id="filesTitle"></h2>
        <ol id="fileList"></ol>
        <p id="filesNote"></p>
      </section>
    </section>
    <div id="streetMessages">
      <div id="ticker" role="status"></div>
      <div id="hint"></div>
    </div>
    <div id="keys">
      ↑ ↓ ← → / WASD / ZQSD &nbsp; Move or drive　 F &nbsp; Enter / exit　 SPACE &nbsp; Slap / handbrake　 E
      &nbsp; Job　 M &nbsp; Map
    </div>
    <div id="touch">
      <div class="pad">
        <button class="up" data-key="up" data-konami="ArrowUp" aria-label="Up">▲</button
        ><button class="left" data-key="left" data-konami="ArrowLeft" aria-label="Left">◀</button
        ><button data-key="down" data-konami="ArrowDown" aria-label="Down">▼</button
        ><button data-key="right" data-konami="ArrowRight" aria-label="Right">▶</button>
      </div>
      <div class="acts">
        <button data-key="car">Board</button><button data-key="job">Job</button><button data-key="run">Run</button
        ><button id="touchSignal" data-key="horn" hidden>Horn</button
        ><button data-key="action">Slap / Brake</button><button data-konami="b">B</button><button data-konami="a">A</button>
      </div>
    </div>
    <dialog id="panel" aria-labelledby="heading">
      <h2 id="heading"></h2>
      <p id="copy"></p>
      <p id="controllerHelp" hidden></p>
      <div id="choices"></div>
      <p id="dialogControls" hidden></p>
    </dialog>
    <!--GAME-->
  </body>
</html>
