<main><header><h1>Sous pli</h1><span>Port-des-Ormes</span></header><div class="spread"><figure aria-label="Flower market and étude">
<button class="pin street" data-place="street" aria-label="Inspect the market car">1</button>
<button class="pin yard" data-place="yard" aria-label="Inspect the courtyard car">2</button>
<button class="pin desk" data-place="desk" aria-label="Visit the étude">3</button></figure>
<section aria-live="polite"><div class="tag">Dossier 014 · Constat</div><h2 id="title"></h2><p id="body"></p><div id="actions"></div><p id="evidence"></p></section></div></main>
<script>
const title=document.querySelector('#title'), body=document.querySelector('#body'), actions=document.querySelector('#actions'), evidence=document.querySelector('#evidence');
const pins=[...document.querySelectorAll('.pin')];
let notes=new Set(), qualified=false, filed=false;
function page(heading,copy,buttons=[]){
 title.textContent=heading;body.textContent=copy;actions.replaceChildren();
 for(const [label,callback] of buttons){const b=document.createElement('button');b.className='action';b.textContent=label;b.onclick=callback;actions.append(b)}
 evidence.textContent=notes.size?'Field notes · '+[...notes].map(x=>x==='yard'?'DV-214-LM, courtyard':'DV-241-LM, flower stall').join(' / '):'Field notes · No photographs yet';
}
function brief(){page('The flower market','At 09:10, a shopkeeper asks you to document where the cream hatchback DV-214-LM is parked. She says it has been blocking deliveries all morning. Select a car in the scene to inspect it.')}
function visit(place){
 if(filed)return;
 for(const p of pins)p.setAttribute('aria-pressed',String(p.dataset.place===place));
 if(place==='desk'){office();return}
 const yard=place==='yard';
 const label=yard?'Courtyard hatchback':'Market hatchback';
 const description=yard?'09:14 · DV-214-LM. The cream hatchback is parked inside the courtyard, beyond the open gate.':'09:14 · DV-241-LM. The cream hatchback is parked alongside the flower stall. A bucket of roses partly covers the rear plate.';
 page(label,description,notes.has(place)?[['Review the file',brief]]:[['Photograph plate & location',()=>{notes.add(place);page('Photo attached',description+' The print is in your file.',[['Return to the étude',()=>visit('desk')],['Review the request',brief]])}]]);
}
function office(){
 if(!notes.has('yard')){page('At the étude',notes.size?'The plate in your photograph differs from the requested plate, DV-214-LM. Inspect the other car before drafting.':'Your file contains the shopkeeper’s statement. You still need a photograph of DV-214-LM and its location.',[['Read the request',brief]]);return}
 if(qualified){page('Ready for signature','“At 09:14, I observed the cream vehicle registered DV-214-LM parked inside the courtyard.” Exhibit A is attached.',[['Sign and file',finish]]);return}
 page('Assistant’s draft','“At 09:14, DV-214-LM was parked inside the courtyard. It had blocked deliveries all morning.” Check the draft against your photograph.',[['Keep both sentences',()=>page('Review the duration','The photograph records one moment. The shopkeeper supplied the account of the morning. How much of the draft can you sign as your own observation?',[['Edit draft',office]])],['Keep the timed observation',()=>{qualified=true;office()}]]);
}
function finish(){filed=true;pins.forEach(p=>p.disabled=true);page('Constat filed','The shopkeeper receives a signed observation with the matching plate, location and time. The photograph stays attached to the case.',[['Replay the case',()=>{notes.clear();qualified=false;filed=false;pins.forEach(p=>{p.disabled=false;p.removeAttribute('aria-pressed')});brief()}]])}
pins.forEach(p=>p.onclick=()=>visit(p.dataset.place));brief();
</script></html>
